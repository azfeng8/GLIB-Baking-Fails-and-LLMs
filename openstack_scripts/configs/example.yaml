# Example config for launching OpenStack experiments.
---
# This specifies the curiosity method argument.
EXPERIMENT_SETS:
  - APPROACHES:
      glib_l2:
        NAME: "GLIB_L2"
        FLAGS:
          learning_name: LNDR
      glib_g1:
        NAME: "GLIB_G1"
        FLAGS:
          learning_name: LNDR
      # oracle:
      #   NAME: "oracle"
      #   FLAGS:
      #     learning_name: LNDR
# Environments to run on.
    ENVS:
      # bakingrealistic:
      #   NAME: "Bakingrealistic"
      gripper:
        NAME: "Easygripper"
      blocks:
        NAME: "Blocks"
      doors:
        NAME: "Glibdoors"
    ARGS: []
    FLAGS: {}
    START_SEED: 1
    NUM_SEEDS: 10
